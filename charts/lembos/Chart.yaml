apiVersion: v2
name: lembos
description: >-
  Lembos, the Internal Developer Platform — Identity, Orchestrator, Portal and the platform Worker, with
  PostgreSQL, Redis and Temporal each simple, highly available, or external.
type: application
version: 0.1.0
appVersion: "0.0.1"
kubeVersion: ">=1.27.0-0"
home: https://github.com/lembosproj/deploy
sources:
  - https://github.com/lembosproj/deploy
  - https://github.com/lembosproj/platform
keywords:
  - internal-developer-platform
  - platform-engineering
  - temporal
annotations:
  # Read by Artifact Hub and by people deciding whether the chart fits their cluster.
  category: Integration and Delivery
  artifacthub.io/license: Apache-2.0

# The high-available Redis and Temporal. Upstream charts rather than templates of our own: failover is exactly
# the part not worth re-implementing. Fetched with `helm dependency build`, pinned by Chart.lock. High-available
# PostgreSQL is a CloudNativePG Cluster this chart renders itself, so it needs the operator rather than a
# dependency.
#
# Each condition is a boolean in the dependency's own values, because that is all Helm can decide on; it has
# to agree with redis.mode and temporal.mode, which templates/validate.yaml enforces.
dependencies:
  - name: redis-ha
    version: 4.39.0
    repository: https://dandydeveloper.github.io/charts
    condition: redis-ha.enabled
  # Aliased so `temporal` can be this chart's own section: its mode, the simple server and the UI.
  - name: temporal
    alias: temporal-ha
    version: 1.7.0
    repository: https://go.temporal.io/helm-charts
    condition: temporal-ha.enabled
