# Lembos on a local k3s, shaped like `aspire start`.
#
# installMode simple: one pod per component, PostgreSQL and Redis StatefulSets, Temporal's auto-setup server,
# and MailPit catching Identity's mail — the same set of containers the app host runs. The published images
# at the chart's appVersion, TLS from a CA the setup job generates, Traefik (k3s's own ingress controller) in
# front, and k3s's built-in NetworkPolicy controller enforcing the policies. The chart README walks through it:
#
#   helm repo add dandydeveloper https://dandydeveloper.github.io/charts
#   helm repo add temporal https://go.temporal.io/helm-charts
#   helm dependency build charts/lembos
#   helm upgrade --install lembos charts/lembos -n lembos --create-namespace -f charts/lembos/values-k3s.yaml
#   kubectl -n kube-system rollout restart deployment/coredns     # once, to load the DNS override below
#
# then trust the generated CA in your browser and open https://portal.lembos.localhost.

installMode: simple

global:
  # *.localhost resolves to the loopback address in browsers with no hosts file, and k3s's service load
  # balancer publishes Traefik on the host's 80 and 443 — so these names reach the cluster from the laptop.
  domain: lembos.localhost
  # Traefik's pods are on k3s's default cluster CIDR; change it with the cluster's --cluster-cidr.
  forwardedHeaders:
    knownNetworks: ["10.42.0.0/16"]

ingress:
  className: traefik
  tls:
    enabled: true
    generate: true

networkPolicy:
  create: true
  # Traefik runs in kube-system on k3s.
  ingressController:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: kube-system
    podSelector:
      matchLabels:
        app.kubernetes.io/name: traefik

identity:
  resources:
    requests: {cpu: 50m, memory: 192Mi}
    limits: {memory: 512Mi}

orchestrator:
  resources:
    requests: {cpu: 50m, memory: 192Mi}
    limits: {memory: 768Mi}

portal:
  resources:
    requests: {cpu: 50m, memory: 192Mi}
    limits: {memory: 768Mi}

worker:
  # One at a time, as under the app host: a laptop shares its CPU with everything else here.
  maxConcurrentRuns: 1
  persistence:
    size: 5Gi
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1536Mi}

postgresql:
  simple:
    persistence:
      size: 2Gi

redis:
  simple:
    persistence:
      size: 512Mi

temporal:
  # temporal.lembos.localhost, behind the same generated certificate. The UI has no authentication of its
  # own; fine on a laptop, an internal ingress class anywhere else.
  ui:
    ingress:
      enabled: true

# mail.lembos.localhost: where invitations and password resets land.
mailpit:
  enabled: true

extraObjects:
  # Inside the cluster *.lembos.localhost would resolve to each pod's own loopback, but the services must
  # reach Identity at its public origin — it is the token issuer. k3s's CoreDNS imports overrides from this
  # ConfigMap, so the names are rewritten to Traefik's Service and the hop goes through the same ingress a
  # browser uses.
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: coredns-custom
      namespace: kube-system
    data:
      lembos.override: |
        rewrite name regex (.*\.)?lembos\.localhost\.? traefik.kube-system.svc.cluster.local. answer auto
