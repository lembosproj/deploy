{{- if .Values.networkPolicy.create }}
{{- $ctx := dict "root" . "component" "worker" -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "lembos.componentName" $ctx }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lembos.labels" $ctx | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "lembos.selectorLabels" $ctx | nindent 6 }}
  policyTypes: [Ingress, Egress]
  # No ingress at all. Kubelet probes are not subject to NetworkPolicy.
  ingress: []
  egress:
    {{- include "lembos.dnsEgress" . | nindent 4 }}
    {{- include "lembos.otelEgress" . | nindent 4 }}
    {{- include "lembos.temporalEgress" . | nindent 4 }}
    - to:
        {{- include "lembos.peer" (dict "root" . "component" "orchestrator") | nindent 8 }}
      ports:
        - {protocol: TCP, port: 8080}
    - to:
        {{- include "lembos.peer" (dict "root" . "component" "identity") | nindent 8 }}
      ports:
        - {protocol: TCP, port: {{ .Values.identity.adminPort }}}
    {{- include "lembos.publicOriginEgress" . | nindent 4 }}
    # Whatever runs reach: registries, git hosts, cloud APIs, target clusters.
    {{- with .Values.networkPolicy.workerEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
