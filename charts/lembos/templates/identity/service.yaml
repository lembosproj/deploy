{{- $ctx := dict "root" . "component" "identity" -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lembos.componentName" $ctx }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lembos.labels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "lembos.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
# The account-management listener, internal only. A Service of its own so nothing that publishes the
# Service above — an Ingress, an HTTPRoute, a mesh's ingress — can reach this port by accident; no template
# in this chart publishes it, and its NetworkPolicy admits the Worker alone. The port is the one Identity
# checks every admin request arrived on, so it is forwarded unchanged.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lembos.componentName" $ctx }}-admin
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lembos.labels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "lembos.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: admin
      port: {{ .Values.identity.adminPort }}
      targetPort: admin
      protocol: TCP
