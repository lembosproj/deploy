{{- /*
Gateway API routes: the same hostnames as the Ingresses, attached to a Gateway the cluster already runs.
TLS terminates at that Gateway's listener.
*/ -}}
{{- if .Values.gateway.enabled }}
{{- range $route := include "lembos.routes" . | fromJsonArray }}
{{- $ctx := dict "root" $ "component" $route.component }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "lembos.componentName" $ctx }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "lembos.labels" $ctx | nindent 4 }}
  {{- with $.Values.gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- required "gateway.parentRefs must name at least one Gateway when gateway.enabled" $.Values.gateway.parentRefs | toYaml | nindent 4 }}
  hostnames:
    - {{ $route.host | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "lembos.componentName" $ctx }}
          port: 8080
      {{- /* The Portal's circuit, the Orchestrator's subscriptions and MailPit's live inbox are long-lived WebSockets. */}}
      {{- if and $route.longLived $.Values.gateway.timeouts }}
      timeouts:
        {{- toYaml $.Values.gateway.timeouts | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
