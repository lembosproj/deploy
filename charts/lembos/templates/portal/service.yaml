{{- $ctx := dict "root" . "component" "portal" -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lembos.componentName" $ctx }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lembos.labels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "lembos.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
