{{- /*
One ServiceAccount per service, none of them bound to any role and none of their tokens mounted: nothing in
Lembos talks to the Kubernetes API of the cluster it runs in.
*/ -}}
{{- range $component := list "identity" "orchestrator" "portal" "worker" }}
{{- $ctx := dict "root" $ "component" $component }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "lembos.componentName" $ctx }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "lembos.labels" $ctx | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
