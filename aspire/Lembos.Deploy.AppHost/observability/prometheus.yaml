# Metrics arrive over OTLP from the gateway collector and by remote write from Tempo's metrics generator, so
# there is nothing to scrape.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

otlp:
  # As labels on every series, so a dashboard can group by service and pod without joining target_info.
  promote_resource_attributes:
    - service.name
    - service.namespace
    - service.instance.id
    - deployment.environment.name
    - k8s.namespace.name
    - k8s.deployment.name
    - k8s.pod.name
    - k8s.container.name
    - k8s.statefulset.name
    - k8s.hpa.name
    - k8s.node.name
  keep_identifying_resource_attributes: true

storage:
  tsdb:
    # A batch can arrive late from the collector; out of order by a few minutes is normal, not an error.
    out_of_order_time_window: 10m
