# The collector: the services' OTLP, the cluster's own state and the kubelet's resource usage, and Temporal's
# server metrics, routed to the store for each signal — traces to Tempo, logs to Loki, metrics to Prometheus.
#
# It runs beside the cluster, so it reaches Kubernetes through the API server with the cluster's kubeconfig
# (KUBECONFIG, from the app host's WithReference): the kubelet through the API server's node proxy.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  # Deployments, ReplicaSets, pods and containers, the autoscaler: what is desired and what is ready.
  k8s_cluster:
    auth_type: kubeConfig
    collection_interval: 30s
    node_conditions_to_report: [Ready, MemoryPressure, DiskPressure]
  # CPU, memory, filesystem and network per pod and container, from the one node's kubelet.
  kubeletstats:
    auth_type: kubeConfig
    # Through the API server's proxy, the endpoint is just the node's name.
    endpoint: ${env:K8S_NODE_NAME}
    collection_interval: 30s
    metric_groups: [node, pod, container]
  # Temporal's server, through its metrics Service, which the service load balancer publishes on the node.
  prometheus:
    config:
      scrape_configs:
        - job_name: temporal
          scrape_interval: 15s
          static_configs:
            - targets: ["k3s:8000"]

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20
  # The kubelet's and the cluster receiver's metrics name a pod; this adds the Deployment it belongs to, which
  # the services already state about themselves.
  k8sattributes:
    auth_type: kubeConfig
    passthrough: false
    pod_association:
      - sources:
          - from: resource_attribute
            name: k8s.pod.name
          - from: resource_attribute
            name: k8s.namespace.name
    extract:
      metadata:
        - k8s.deployment.name
        - k8s.statefulset.name
        - k8s.node.name
  batch: {}

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
  otlphttp/prometheus:
    endpoint: http://prometheus:9090/api/v1/otlp

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp, k8s_cluster, kubeletstats, prometheus]
      processors: [memory_limiter, k8sattributes, batch]
      exporters: [otlphttp/prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/loki]
