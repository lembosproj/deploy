name: Chart

# Pull requests and main validate the chart and build the app host. A pass on main is what release.yml waits
# for: it decides from the commits whether there is a chart to publish, and publishes it.
on:
  pull_request:
    branches:
      - main
    paths:
      - "charts/**"
      - "aspire/**"
      - "global.json"
      - "nuget.config"
      - ".github/workflows/chart.yml"
      - ".github/workflows/release.yml"
      - "release.config.mjs"
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Helm chart
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      # build, not update: exactly what Chart.lock records, digests checked, and a failure when the lock and
      # Chart.yaml disagree — so a dependency moves only in a reviewed change to both.
      - name: Fetch dependencies
        run: |
          helm repo add dandydeveloper https://dandydeveloper.github.io/charts
          helm repo add temporal https://go.temporal.io/helm-charts
          helm dependency build charts/lembos
      # Every values file the chart ships or tests with, rendered and checked against the Kubernetes schemas
      # strictly — a key the API server would drop silently is a failure here. The defaults are
      # ci/default-values.yaml, because the chart refuses to render without somewhere to send mail.
      # values-ha.yaml asks for a relay and the ingress controller's network on the command line, so it is given
      # both here. The API versions stand
      # in for the operators and CRDs a cluster would have: the chart checks for them before rendering
      # resources of their kinds, and a render has no cluster to ask.
      - name: Lint and validate
        run: |
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.7.0
          helm lint charts/lembos -f charts/lembos/ci/default-values.yaml
          for values in charts/lembos/values-ha.yaml charts/lembos/ci/*.yaml aspire/Lembos.Deploy.AppHost/values.aspire.yaml; do
            echo "::group::$values"
            relay=()
            [[ "$values" == *values-ha.yaml ]] && relay=(--set-string identity.smtp.endpoint=smtp://relay.example.org:25 --set 'global.forwardedHeaders.knownNetworks={10.244.0.0/16}')
            # The app host sets the PostgreSQL and Redis passwords from parameters.
            [[ "$values" == *values.aspire.yaml ]] && relay=(--set-string postgresql.external.password=rendered-by-ci --set-string redis.external.password=rendered-by-ci)
            helm template lembos charts/lembos --namespace lembos -f "$values" "${relay[@]}" \
              --api-versions postgresql.cnpg.io/v1/Cluster --api-versions postgresql.cnpg.io/v1/Database \
              --api-versions gateway.networking.k8s.io/v1/HTTPRoute \
              --api-versions keda.sh/v1alpha1/ScaledObject \
              | "$(go env GOPATH)/bin/kubeconform" -strict -summary -kubernetes-version 1.33.0 \
                  -schema-location default \
                  -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
            echo "::endgroup::"
          done

      # The `platform` section of values.schema.json is a copy of the platform's generated contract, which the
      # platform's release publishes as a public OCI artifact beside its images — public, so this pulls it
      # anonymously while the platform repository stays private. Compared here so a setting the platform
      # added, or renamed, cannot sit unknown to the chart: scripts/sync-platform-schema.sh refreshes the copy.
      # A release that published no contract has nothing to compare, which is said rather than failed; the
      # chart's own release fails on it, below.
      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
      - name: Compare the platform contract
        run: |
          version="$(yq '.appVersion' charts/lembos/Chart.yaml)"
          artifact="ghcr.io/${{ github.repository_owner }}/platform/values-schema:${version}"
          if ! oras pull "$artifact" -o platform-contract; then
            echo "::warning::${artifact} is not published, or not public; the platform section was not compared."
            exit 0
          fi
          diff <(jq -S .properties.platform charts/lembos/values.schema.json) <(jq -S . platform-contract/platform-values.schema.json) \
            || { echo "::error::values.schema.json's platform section differs from the platform contract at ${version}. Run scripts/sync-platform-schema.sh and commit the result."; exit 1; }

  # Built, not run: a run needs privileged containers and pulls every image, which is a laptop's job. This
  # keeps the getting-started path compiling — warnings, including the NuGet audit, are errors.
  apphost:
    name: Aspire app host
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build Lembos.Deploy.slnx

  # Dependabot's minor and patch updates merge themselves once the chart validates and the app host builds.
  # Majors wait for a person: they are the kind that needs reading. Merging here, after both jobs, rather than
  # with GitHub's auto-merge, means nothing merges unvalidated even if no branch rule requires the checks. An
  # update to a file this workflow does not watch — the markdownlint or CLA workflows — never gets here, and
  # waits for a person too.
  dependabot:
    name: Merge Dependabot update
    needs: [validate, apphost]
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: update
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # A chore merged with GITHUB_TOKEN starts no push workflow, so main is not revalidated and nothing is
      # released — which is right for a chore, and the next merge a person makes validates main again.
      - name: Merge
        if: steps.update.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
